---
- name: Configure all servers
  hosts: all
  become: true

  roles:
    - common
    - docker
    - webmin


- name: Configure monitoring server
  hosts: monitoring
  become: true

  roles:
    - monitoring
    - heimdall
    - dozzle
    - portainer
    - uptimekuma
    
- name: Configure Developer server
  hosts: developer
  become: true

  roles:
    - developer
    - dozzle-agent
    - databases
    - gitea

- name: Configure Media server
  hosts: media
  become: true

  roles:
    - media
    - dozzle-agent

