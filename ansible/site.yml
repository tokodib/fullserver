---
- name: Configure all servers
  hosts: all
  become: true

  roles:
    - common
    - docker
    - webmin


- name: Configure monitoring server
  hosts: monitoring
  become: true

  roles:
    - monitoring

- name: Configure Developer server
  hosts: developer
  become: true

  roles:
    - developer

- name: Configure Media server
  hosts: media
  become: true

  roles:
    - media

